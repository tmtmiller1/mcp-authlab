# Gate a deployment on the authorization grade of a staging MCP server, and send the findings to code scanning.
# Run `mcp-authlab login https://mcp.staging.example.com/mcp` once on a workstation and paste the contents of
# ~/.config/mcp-authlab/tokens.json into the MCP_AUTHLAB_TOKENS_JSON secret: the job then runs every check,
# including the three critical ones. Without that secret the scan runs the unauthenticated checks only.
# Refresh tokens rotate, so the stored one works for one refresh. When the report says the token has
# expired, log in again and update the secret.
# The scan reads authlab.toml from your repo: copy examples/policy.toml there, or drop --policy.
name: mcp-auth-conformance
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Secrets can't appear in an `if:`, so expose this one as an env var and test that instead.
      TOKENS: ${{ secrets.MCP_AUTHLAB_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mcp-authlab==0.2.2
      - name: restore stored tokens
        if: env.TOKENS != ''
        run: |
          install -d -m 700 "$HOME/.config/mcp-authlab"
          printf '%s' "$TOKENS" > ~/.config/mcp-authlab/tokens.json
          chmod 600 ~/.config/mcp-authlab/tokens.json
      - run: mcp-authlab scan https://mcp.staging.example.com/mcp --policy authlab.toml --format markdown -o report.md
      - if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: mcp-authlab scan https://mcp.staging.example.com/mcp --format sarif -o report.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
