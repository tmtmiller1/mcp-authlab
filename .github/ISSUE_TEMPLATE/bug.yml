name: Bug or false positive
description: A check reported the wrong result, or the tool misbehaved.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: mcp-authlab version
      description: Output of `mcp-authlab --version`.
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: Check ID
      description: For a wrong result, the check involved, e.g. TOK-03.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: If a check is wrong, quote the spec text you think applies.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: >
        Output of `mcp-authlab scan <url> --format json --requests`. Tokens, codes and session IDs are redacted,
        but read it over before posting.
      render: json
