name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . ruff==0.15.22 mypy==2.1.0
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
  demo-from-checkout:
    # What the README tells people to do: clone, then run the demo, with nothing installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          scripts/demo.sh passthrough --no-color > passthrough.txt || true
          cat passthrough.txt
          grep -q "^level    Unsafe   grade F" passthrough.txt
          scripts/demo.sh reference --fail-under A --no-color
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: reference server logs in and grades A with every check run
        run: |
          scripts/demo.sh reference --fail-under A --no-color > reference.txt
          cat reference.txt
          grep -q "^coverage 33/33" reference.txt
      - name: broken profiles are caught
        run: |
          set -e
          for p in passthrough sloppy open; do
            if scripts/demo.sh "$p" --fail-under B --no-color >/dev/null; then echo "$p should have failed"; exit 1; fi
          done
      - name: reports
        if: matrix.python == '3.12'
        run: |
          mkdir -p reports
          for p in reference legacy weak-as passthrough sloppy open mismatch; do
            scripts/demo.sh "$p" --format markdown -o "reports/$p.md" || true
            scripts/demo.sh "$p" --format sarif -o "reports/$p.sarif" || true
          done
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: fixture-reports
          path: reports/
