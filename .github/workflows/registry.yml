# Scan the public endpoints in registry/endpoints.toml every Monday, unauthenticated, and commit the results.
name: registry
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python3 registry/scan.py
      - name: commit results
        run: |
          git config user.name "registry scan"
          git config user.email "actions@users.noreply.github.com"
          git add registry/results registry/README.md
          git diff --cached --quiet && exit 0
          git commit -m "registry: weekly scan $(date -u +%F)"
          git push
